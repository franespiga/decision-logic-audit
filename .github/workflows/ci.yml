name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / CPython 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Unit tests
        run: |
          python -m unittest tests.test_cross_architecture -v
          python -m pytest tests/test_audit_scoring tests/test_release_support.py
      - name: Installed import smoke
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import ablation, audit_scoring, models, regime_representation, rl_factory_shim, decision_logic_audit"
          python -c "from decision_logic_audit.cli import build_parser; build_parser().parse_args(['diagnose'])"
